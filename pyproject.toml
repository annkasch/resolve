[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve"
version = "1.0.0"
description = "A Python package for rare-event surrogate modeling (RESOLVE)"
authors = [
    { name = "annkaschue", email = "annkaschue@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "torch==2.9.0",
    "tensorboard",
    "matplotlib",
    "pyyaml",
    "ipywidgets",
    "tqdm",
    "h5py",
    "pandas",
    "scikit-learn",
    "imbalanced-learn==0.8.1",
    "termcolor",
    "scipy",
    "GPy==1.13.2",
    "emukit==0.4.11",
    "backports.tarfile",
    "pymc==5.22.0",
    "xgboost",
    "zarr",
    "numcodecs",
    "seaborn"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
boosting = [
    "lightgbm",
]
graphs = [
    "hnswlib",
    "torch-geometric",
]
analysis = [
    "umap-learn",
]
memory-bank = [
    "faiss-cpu",
]
all = [
    "lightgbm",
    "hnswlib",
    "torch-geometric",
    "umap-learn",
    "faiss-cpu",
]

[tool.setuptools.packages.find]
include = ["resolve*"]

[project.urls]
Homepage = "https://github.com/annkasch/resolve"
